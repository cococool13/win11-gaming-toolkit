version: 2

# The toolkit itself is PowerShell with no package manager, so GitHub Actions
# is the only ecosystem here with dependencies to track. Grouped so routine
# bumps arrive as one PR rather than one per action.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
